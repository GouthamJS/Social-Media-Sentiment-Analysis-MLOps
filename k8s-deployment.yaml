apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-analysis-app
  labels:
    app: sentiment-analysis
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentiment-analysis
  template:
    metadata:
      labels:
        app: sentiment-analysis
        tier: backend
    spec:
      containers:
      - name: sentiment-api
        image: sentiment-analysis:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLASK_ENV
          value: "production"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment-analysis-service
spec:
  type: NodePort
  selector:
    app: sentiment-analysis
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http